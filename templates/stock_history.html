<!DOCTYPE html>
<html>
<head>
    <title>Stock history - SmartShop</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    {% include "nav.html" %}
    <h1>Stock history</h1>
    <p><a href="/products">Back to products</a></p>

    <table border="1" cellpadding="6">
        <tr>
            <th>Date</th>
            <th>Product</th>
            <th>Type</th>
            <th>Quantity</th>
            <th>Reason</th>
        </tr>
        {% for m in movements %}
        <tr>
            <td>{{ m["created_at"] }}</td>
            <td>{{ m["product_name"] }}</td>
            <td>{{ m["movement_type"] }}</td>
            <td>{{ m["quantity"] }}</td>
            <td>{{ m["reason"] }}</td>
        </tr>
        {% endfor %}
    </table>
</body>
</html>
